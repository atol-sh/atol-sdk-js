name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Typecheck + tests + coverage + build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Pin package npm
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Coverage is a HARD GATE: the thresholds in vitest.config.ts fail
      # the run if the security-critical modules drop below their floor.
      - name: Unit tests + coverage (vitest)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Verify package (publint + are-the-types-wrong)
        run: |
          npx publint
          npx @arethetypeswrong/cli --pack . --profile node16

      - name: npm audit (moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball (consumed by @atol-sh/react + console e2e)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atol-sh-js-tgz
          path: atol-sh-js-*.tgz
          retention-days: 14
